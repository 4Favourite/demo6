<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Build Archive</title>
<style>
:root{--ink:#fff;--pink:#f2a3bb;--amber:#ffb81f;--red:#ff4a4a;--cyan:#6fe3d8;--bg:#0b0d1c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Inter,Arial,sans-serif}
#scroll{height:520vh}
#stage{position:fixed;inset:0;overflow:hidden}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;font-size:11px;letter-spacing:.02em}
header .brand{font-weight:600}
header .dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;font-size:8px;opacity:.7;letter-spacing:.12em}
header .dots i{width:3px;height:3px;border-radius:50%;background:#fff;opacity:.35;transition:.3s}
header .dots i.on{opacity:1;transform:scale(1.5)}
header .right{display:flex;gap:12px;align-items:center}
header .pill{border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:4px 12px;font-size:10px;background:rgba(0,0,0,.25);backdrop-filter:blur(6px)}
header .burger{width:14px;height:8px;border-top:1.5px solid #fff;border-bottom:1.5px solid #fff}

/* ---------- terrain ---------- */
#terrain{position:absolute;inset:-10%;background:
  url(terrain.jpg) 50% 50%/cover no-repeat,
  radial-gradient(ellipse at 30% 40%,#8b8a5e 0,#4d5a47 35%,#1f2a3a 75%);
  will-change:transform,filter}
#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,30,.55),rgba(8,12,30,0) 60%),linear-gradient(0deg,rgba(8,12,30,.35),transparent 40%);pointer-events:none}
#fog{position:absolute;inset:-5%;opacity:0;pointer-events:none;will-change:transform,opacity;background:url(fog.jpg) center/cover no-repeat}
#fog svg{display:none}
#fog svg{width:100%;height:100%}

/* ---------- jets ---------- */
.jet{position:absolute;left:50%;top:50%;width:40vmin;aspect-ratio:976/1099;margin:-22.5vmin 0 0 -20vmin;
  background:url(jet.png) center/contain no-repeat;filter:drop-shadow(0 40px 30px rgba(0,0,0,.5)) saturate(1.05);will-change:transform,opacity}
.jet.fb{background:#2a2f3d;clip-path:polygon(50% 0,100% 85%,82% 95%,62% 78%,50% 100%,38% 78%,18% 95%,0 85%);filter:none}

/* ---------- copy ---------- */
.title{position:absolute;left:5vw;top:15vh;max-width:15ch;font-size:clamp(22px,3.4vw,44px);line-height:1.04;font-weight:600;letter-spacing:-.02em;opacity:0;will-change:transform,opacity}
.title.pink{color:var(--pink)}

/* ---------- detection tags ---------- */
.tag{position:absolute;width:26px;height:8px;background:var(--amber);opacity:0;border-radius:1px}
.tag.big{width:34px;height:10px}

/* ---------- dark map ---------- */
#map{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#1a1d3a 0,#0b0d1c 70%);opacity:0;will-change:opacity}
#map .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.4px);background-size:26px 26px;
  -webkit-mask:radial-gradient(ellipse at center,#000 40%,transparent 85%);mask:radial-gradient(ellipse at center,#000 40%,transparent 85%)}
#region{position:absolute;left:50%;top:54%;width:min(62vw,620px);transform:translate(-50%,-50%);will-change:transform}
#region svg{width:100%;overflow:visible}
.poly{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.85);stroke-width:1.6}
.glow{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fff 0,var(--c,#ffb81f) 18%,rgba(255,184,31,.0) 68%);--c:#ffb81f;transition:none;will-change:opacity}
.glow.hot{background:radial-gradient(circle,#ffd0d0 0,var(--red) 22%,rgba(255,74,74,0) 68%)}
.label{position:absolute;font-size:8px;letter-spacing:.08em;padding:3px 8px;background:var(--amber);color:#000;font-weight:700;transform:translate(-50%,-50%)}
.label.red{background:var(--red);color:#fff}
.br{position:absolute;width:26px;height:26px;border:1.5px solid var(--cyan);opacity:0;will-change:opacity}
.br.tl{border-right:0;border-bottom:0}.br.tr{border-left:0;border-bottom:0}.br.bl{border-right:0;border-top:0}.br.brr{border-left:0;border-top:0}
.arrow{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));transform-origin:100% 50%;opacity:0;will-change:transform,opacity}
.arrow::after{content:"";position:absolute;right:-2px;top:-4px;border-left:10px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.drone{position:absolute;width:14px;height:12px;background:#fff;clip-path:polygon(50% 0,100% 100%,50% 75%,0 100%);opacity:0}
#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;opacity:.7;z-index:20;transition:opacity .4s}
</style>
</head>
<body>
<header>
  <div class="brand">My Build Archive</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="right"><span class="pill">Menu</span><span class="burger"></span></div>
</header>

<div id="scroll"></div>
<div id="stage">
  <div id="terrain"></div>
  <div id="shade"></div>
  <div id="fog"><svg viewBox="0 0 800 800" preserveAspectRatio="none">
    <filter id="f" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".006 .011" numOctaves="5" seed="7"/>
      <feColorMatrix values="0 0 0 0 .95  0 0 0 0 .88  0 0 0 0 .7  0 0 0 2.4 -.55"/></filter>
    <rect width="800" height="800" filter="url(#f)"/></svg></div>

  <div class="jet" id="j0"></div><div class="jet" id="j1"></div><div class="jet" id="j2"></div>

  <div class="title" id="t0">Securing the skies with autonomous intelligence</div>
  <div class="title pink" id="t1">Understanding the Swarm System</div>
  <div class="title pink" id="t2">Real-time detection</div>
  <div id="tags"></div>

  <div id="map">
    <div class="grid"></div>
    <div class="title" id="t3" style="opacity:0">Analysis &amp; evaluation</div>
    <div id="region">
      <svg viewBox="0 0 400 300"><path class="poly" d="M60 150 L95 120 L150 112 L190 70 L250 40 L300 28 L340 55 L330 100 L352 140 L345 190 L300 225 L250 262 L190 280 L130 258 L95 225 L62 190 Z"/></svg>
      <div class="glow" id="g0" style="left:34%;top:52%"></div>
      <div class="glow" id="g1" style="left:78%;top:36%"></div>
      <div class="glow" id="g2" style="left:57%;top:82%"></div>
      <div class="label" id="lab" style="left:28%;top:26%">THERMAL SIGNATURE</div>
    </div>
    <div class="br tl" style="left:22%;top:20%"></div><div class="br tr" style="right:18%;top:26%"></div>
    <div class="br bl" style="left:24%;bottom:22%"></div><div class="br brr" style="right:20%;bottom:20%"></div>
    <div class="arrow" id="a0" style="width:34vmin;left:50%;top:38%"></div>
    <div class="arrow" id="a1" style="width:42vmin;left:58%;top:34%"></div>
    <div class="drone" id="d0"></div><div class="drone" id="d1"></div>
  </div>
</div>
<div id="hint">SCROLL</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
// fade in at [a,b], out at [c,d]
const win=(p,a,b,c,d)=>ease(seg(p,a,b))*(1-ease(seg(p,c,d)));

// fallback jet shape if jet.png is missing
const probe=new Image();probe.onerror=()=>document.querySelectorAll('.jet').forEach(j=>j.classList.add('fb'));probe.src='jet.png';

// detection tags (scene 3)
const tagPos=[[8,70],[17,52],[28,35],[22,82],[37,60],[44,22],[52,74],[61,44],[68,28],[74,66],[83,36],[90,58],[12,30],[56,88],[80,82],[46,48]];
const tagsEl=$('tags');
tagPos.forEach(([x,y],i)=>{const d=document.createElement('div');d.className='tag'+(i%4==0?' big':'');d.style.left=x+'vw';d.style.top=y+'vh';tagsEl.appendChild(d)});
const tags=[...tagsEl.children];

const dots=[...document.querySelectorAll('#dots i')];
const el={terrain:$('terrain'),fog:$('fog'),map:$('map'),region:$('region'),
  j:[$('j0'),$('j1'),$('j2')],t:[$('t0'),$('t1'),$('t2'),$('t3')],
  g:[$('g0'),$('g1'),$('g2')],lab:$('lab'),a:[$('a0'),$('a1')],d:[$('d0'),$('d1')],
  br:[...document.querySelectorAll('.br')],hint:$('hint')};

let target=0,cur=0;
const read=()=>{const m=document.documentElement.scrollHeight-innerHeight;target=m>0?scrollY/m:0};
addEventListener('scroll',read,{passive:true});addEventListener('resize',read);read();

function render(p){
  /* ---- terrain: push in, pull back, then plunge into the clouds ---- */
  const s1=ease(seg(p,0,.3)), s2=ease(seg(p,.3,.62)), s3=ease(seg(p,.55,.76));
  const scale=lerp(1.55,1.05,s1)+lerp(0,.12,s2)+lerp(0,.9,s3);
  el.terrain.style.transform=`scale(${scale}) rotate(${lerp(-3,2,p)}deg) translate(${lerp(3,-3,p)}%,${lerp(9,-9,p)}%)`;
  el.terrain.style.filter=`blur(${s3*9}px) saturate(${1-s3*.2})`;
  el.fog.style.opacity=win(p,.54,.68,.78,.88);
  el.fog.style.transform=`scale(${lerp(1.1,2.6,seg(p,.5,.82))}) rotate(${lerp(-6,8,seg(p,.5,.82))}deg)`;
  el.terrain.style.opacity=1-ease(seg(p,.74,.8));
  document.getElementById('shade').style.opacity=1-ease(seg(p,.7,.78));

  /* ---- jets ---- */
  const a=seg(p,0,.26), b=seg(p,.26,.5), c=seg(p,.5,.7);
  // lead jet: big diagonal fly-in -> centre of swarm -> small, scanning
  const lead=el.j[0];
  const ls=lerp(1.5,1.0,ease(a))*lerp(1,.72,ease(c));
  lead.style.transform=`translate(${lerp(8,0,ease(a))*1}vw,${lerp(4,0,ease(a))+lerp(0,-3,ease(b))}vh) rotate(${lerp(58,0,ease(a))}deg) scale(${ls})`;
  lead.style.opacity=ease(seg(p,0,.03))*(1-ease(seg(p,.66,.72)));
  // wingmen
  [[-1,.9],[1,.9]].forEach(([dir],i)=>{
    const j=el.j[i+1], on=ease(seg(p,.2,.38))*(1-ease(seg(p,.44,.54)));
    const x=dir*lerp(8,24,ease(b)), y=lerp(-6,13,ease(b))+dir*lerp(0,4,b)*-1;
    j.style.transform=`translate(${x}vw,${y}vh) rotate(${dir*lerp(-8,0,b)}deg) scale(.58)`;
    j.style.opacity=on;
  });

  /* ---- titles ---- */
  const T=[win(p,.0,.03,.17,.23),win(p,.26,.3,.44,.5),win(p,.5,.54,.62,.67),win(p,.8,.84,.92,.98)];
  el.t.forEach((t,i)=>{t.style.opacity=T[i];t.style.transform=`translateY(${(1-T[i])*18}px)`});

  /* ---- detection tags ---- */
  tags.forEach((t,i)=>{const o=ease(seg(p,.52+i*.004,.56+i*.004))*(1-ease(seg(p,.64,.69)));
    t.style.opacity=o;t.style.transform=`scale(${lerp(.4,1,o)}) translateY(${Math.sin(p*40+i)*2}px)`});

  /* ---- dark map ---- */
  el.map.style.opacity=ease(seg(p,.72,.82));
  const zoom=lerp(1.15,.72,ease(seg(p,.8,.99)));
  el.region.style.transform=`translate(-50%,-50%) scale(${zoom}) rotate(${lerp(-4,0,ease(seg(p,.74,.9)))}deg)`;
  const hot=ease(seg(p,.9,.96)), appear=ease(seg(p,.76,.86));
  el.g.forEach((g,i)=>{
    const pulse=1+Math.sin(p*60+i*2)*.05;
    g.style.opacity=appear;g.style.transform=`translate(-50%,-50%) scale(${pulse*lerp(.7,1,appear)*(1+hot*.15)})`;
    g.classList.toggle('hot',hot>.5);
  });
  el.lab.textContent=hot>.5?'THREAT / CONFIRMED':'THERMAL SIGNATURE';
  el.lab.classList.toggle('red',hot>.5);
  el.lab.style.opacity=appear;
  const ar=ease(seg(p,.84,.9))*(1-ease(seg(p,.97,1)));
  el.a.forEach((x,i)=>{x.style.opacity=ar;x.style.transform=`rotate(${i?-132:-146}deg) translateX(${(1-ar)*-60}px)`;});
  el.d.forEach((d,i)=>{const t=ease(seg(p,.86,.94));d.style.opacity=ar;
    d.style.left=`${lerp(i?72:60,i?58:49,t)}%`;d.style.top=`${lerp(i?22:28,i?47:44,t)}%`;d.style.transform=`rotate(${i?215:205}deg)`});
  el.br.forEach(b=>b.style.opacity=ease(seg(p,.9,.96)));

  /* ---- chrome ---- */
  const idx=p<.26?0:p<.5?1:p<.7?2:p<.82?3:p<.92?4:5;
  dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
  el.hint.style.opacity=p<.02?.7:0;
}

(function loop(){cur+=(target-cur)*.075;if(Math.abs(target-cur)<.0001)cur=target;render(cur);requestAnimationFrame(loop)})();
})();
</script>
</body>
</html>
